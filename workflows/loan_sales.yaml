id: loan_sales
name: "Pre-Approved Personal Loan Sales"
goal: "Qualify prime retail leads for instant personal loans, research bureau capacity, evaluate offer sanction, and conduct vernacular outreach with document dispatch."
success_metric: "qualified_leads"
policy_file: "policies/loan_sales_policy.txt"
sample_data_file: "data/sales_leads.csv"

human_escalation_rules:
  - condition: "record.data.get('intent') == 'hardship' or 'negotiat' in str(record.data.get('offer_made')).lower()"
    target_desk: "Senior Relationship Manager (Elite Sales)"
    reason: "Lead requested custom rate concession or specialized loan product"
  - condition: "record.data.get('audit_pass') is False"
    target_desk: "Sales Compliance Desk"
    reason: "TRAI or misrepresentation flag triggered during pitch"

steps:
  - id: lead
    name: "Lead Intake & Qualification"
    agent: "Intake"
    retry_limit: 3
    on_failure: "escalate"
    input_fields: ["customer_name", "credit_score", "preapproved_amount"]
    output_fields: ["tone_hint", "best_call_window"]

  - id: research
    name: "Credit Bureau Research"
    agent: "Research"
    retry_limit: 3
    on_failure: "escalate"
    input_fields: ["credit_score", "preapproved_amount"]
    output_fields: ["bureau_tier", "income_multiplier"]

  - id: offer
    name: "Sanction Terms & Decision"
    agent: "Decision"
    retry_limit: 3
    on_failure: "escalate"
    input_fields: ["preapproved_amount", "policy_file"]
    output_fields: ["intent", "sentiment", "offer_made", "confidence"]

  - id: outreach
    name: "Conversational Outreach & Doc Dispatch"
    agent: "Outreach"
    retry_limit: 3
    on_failure: "escalate"
    input_fields: ["language", "customer_name", "preapproved_amount"]
    output_fields: ["application_link", "docs_requested", "whatsapp_message"]
