id: collections
name: "Early Delinquency Collections (EMI)"
goal: "Recover bounced retail EMIs (1-30 DPD), verify borrower identity, negotiate valid PTPs, audit RBI compliance, dispatch instant UPI payment links, and escalate exceptions to human teams."
success_metric: "recovery_pct"
policy_file: "policies/collections_rules.yaml"
sample_data_file: "data/sample_book.csv"

human_escalation_rules:
  - condition: "record.data.get('identity_verified') is False"
    target_desk: "Fraud Prevention & Identity Verification Desk"
    reason: "Borrower failed 4-digit loan ID verification; zero debt disclosure"
  - condition: "record.data.get('intent') == 'dispute'"
    target_desk: "Dispute Resolution Desk (Ops)"
    reason: "Borrower asserts prior payment or ledger error"
  - condition: "record.data.get('intent') == 'hardship' and not record.data.get('needs_approval')"
    target_desk: "Credit Committee (Hardship Desk)"
    reason: "Borrower seeks interest waiver or loan restructuring"
  - condition: "record.data.get('audit_pass') is False"
    target_desk: "Chief Compliance Officer"
    reason: "Fair Practices Code violation detected in call transcript"

steps:
  - id: intake
    name: "Account Profiling"
    agent: "Intake"
    retry_limit: 3
    on_failure: "escalate"
    input_fields: ["amount_due", "dpd", "language", "loan_id"]
    output_fields: ["risk_note", "tone_hint", "best_call_window"]

  - id: conversation
    name: "Outbound Call & Consent"
    agent: "Conversation"
    retry_limit: 3
    on_failure: "escalate"
    input_fields: ["language", "customer_name", "phone", "amount_due"]
    output_fields: ["consent_played", "transcript", "cost_inr", "identity_verified"]

  - id: negotiation
    name: "Entity Extraction & PTP Proposal"
    agent: "Negotiation"
    retry_limit: 3
    on_failure: "escalate"
    condition: "record.status not in ('escalated', 'failed')"
    input_fields: ["transcript", "amount_due"]
    output_fields: ["llm_proposal", "understood_chips"]

  - id: policy_engine
    name: "Deterministic Policy Engine"
    agent: "PolicyEngine"
    retry_limit: 3
    on_failure: "escalate"
    condition: "record.status not in ('failed',)"
    input_fields: ["llm_proposal", "policy_file"]
    output_fields: ["policy_decision", "policy_firewall"]

  - id: human_approval
    name: "Credit Authority Sign-Off"
    agent: "HumanApproval"
    retry_limit: 3
    on_failure: "escalate"
    condition: "record.data.get('needs_approval') is True"
    input_fields: ["shortfall_amount", "amount_due"]
    output_fields: ["approval_decision", "approved_by"]

  - id: compliance
    name: "Conduct Rules & Compliance Gate"
    agent: "Compliance"
    retry_limit: 3
    on_failure: "escalate"
    condition: "record.status not in ('awaiting_approval', 'failed')"
    input_fields: ["transcript", "ai_disclosure_played", "recording_disclosure_played", "identity_verified"]
    output_fields: ["audit_pass", "audit_reason"]

  - id: action
    name: "Lender Escrow UPI Link & WhatsApp"
    agent: "Action"
    retry_limit: 3
    on_failure: "escalate"
    condition: "record.status not in ('escalated', 'awaiting_approval', 'failed') and record.data.get('audit_pass') is True"
    input_fields: ["amount_due", "ptp_date", "language", "loan_id", "policy_decision"]
    output_fields: ["payment_link", "payment_status"]

  - id: reporter
    name: "Portfolio Sync & Metrics"
    agent: "Reporter"
    retry_limit: 3
    on_failure: "continue"
    input_fields: []
    output_fields: ["macro_metrics"]
