# lender-owned, board-approved policy (demo)
policy_meta:
  policy_version: "2026.4-LENDER-APPROVED"
  policy_name: "Early Delinquency & Borrower Conduct Policy"
  approved_by: "Board of Directors, Demo Lender A & Participating Lenders"
  effective_date: "2026-04-01"
  governance_statement: "Enforces lender policy (demo); supports RBI conduct rules."
  industry_benchmarks:
    bounced_emi_fee_range: "Rs 50-150 per bounced EMI (PayU, citing CRISIL)"
    field_visit_cost_range: "Rs 250-500 per field visit (Business Standard)"
    source_note: "industry figures reported by other sources"

opening_disclosures:
  ai_disclosure:
    mandatory: true
    rule_id: "DISC-AI-01"
    phrase_en: "I am an AI assistant calling on behalf of Demo Lender"
    phrase_hi: "मैं डेमो लेंडर की ओर से बोल रहा एक एआई असिस्टेंट हूँ"
    phrase_mr: "मी डेमो लेंडरच्या वतीने बोलणारा एक एआई असिस्टंट आहे"
  recording_disclosure:
    mandatory: true
    rule_id: "DISC-REC-02"
    phrase_en: "This call is recorded for quality and regulatory compliance"
    phrase_hi: "यह कॉल गुणवत्ता और अनुपालन निगरानी के लिए रिकॉर्ड की जा रही है"
    phrase_mr: "हा कॉल गुणवत्ता आणि नियामक सुरखेसाठी रेकॉर्ड केला जातोय"
  human_opt_out:
    mandatory: true
    rule_id: "DISC-HUMAN-03"
    phrase_en: "You can say 'human' anytime to speak with a person"
    phrase_hi: "किसी भी समय किसी व्यक्ति से बात करने के लिए 'इंसान' या 'अधिकारी' बोलें"
    phrase_mr: "व्यक्तीशी बोलण्यासाठी कधीही 'इंसान' किंवा 'अधिकारी' बोला"
  human_escalation_keywords:
    - "human"
    - "agent"
    - "person"
    - "representative"
    - "इंसान"
    - "अधिकारी"
    - "एजेंट"
    - "व्यक्ति"
    - "माणूस"
    - "अधिकारी"
    - "प्रतिनिधी"
    - "adhikari"
    - "manus"

identity_verification:
  mandatory: true
  rule_id: "RBI-PRIVACY-ID01"
  field: "loan_id"
  digits_to_verify: 4
  max_attempts: 2
  on_failure: "terminate_zero_disclosure"
  third_party_contact:
    prohibit_disclosure: true
    polite_termination: true
    retry_after_hours: 24  # lender-configurable: no retry for 24h
    log_event: "third_party_contact"

sensitive_event_pause:
  rule_id: "FAIR-PRAC-SENS01"
  policy_instruction: "Immediate stop upon bereavement, hospitalization, medical emergency, natural calamity, or wedding. Express concern, no negotiation, no payment link, set do_not_contact_until 7 days. Create human follow-up task: check whether borrower has any insurance cover."
  do_not_contact_days: 7  # demo default 7 days, lender-configurable
  allow_negotiation: false
  allow_payment_link: false
  human_follow_up_task: "check whether borrower has any insurance cover"
  target_desk: "Sensitive Care & Compassionate Follow-up Desk"
  triggers:
    bereavement:
      - "death"
      - "passed away"
      - "funeral"
      - "demise"
      - "मृत्यू"
      - "निधन"
      - "वारले"
      - "मयत"
      - "क्रियाकर्म"
    medical_emergency:
      - "hospital"
      - "हॉस्पिटल"
      - "hospitalised"
      - "hospitalized"
      - "icu"
      - "accident"
      - "अपघात"
      - "दवाखाना"
      - "ऍडमिट"
      - "एडमिट"
      - "बीमार"
      - "गंभीर"
      - "operation"
      - "इलाज"
    calamity:
      - "flood"
      - "earthquake"
      - "cyclone"
      - "पूर"
      - "भूकंप"
      - "आपत्ती"
      - "आपदा"
      - "आग"
    marriage_function:
      - "wedding"
      - "marriage"
      - "लग्न"
      - "शादी"
      - "विवाह"

distress_path:
  rule_id: "FAIR-PRAC-DISTRESS01"
  triggers:
    - "job loss"
    - "lost my job"
    - "नोकरी गेली"
    - "काम छूट गया"
    - "salary delay"
    - "पगार झाला नाही"
    - "salary nahi aayi"
    - "business loss"
    - "धंद्यात तोटा"
  promise_waiver: false  # Promise NO waiver
  permitted_options:
    - "Short grace-period extension (strictly within policy limit of 7 days)"
    - "Affordable upfront part-payment (>= 30%) with remainder committed within 7 days"
    - "Direct handover to certified human credit counsellor for restructuring review"
  pre_escalation_record_required: true
  target_desk: "Credit Restructuring & Financial Counselling Desk"

contact_rules:
  calling_hours_ist:
    start_ist: "08:00"
    end_ist: "19:00"
    demo_override: true
    description: "Enforces lender policy (demo); supports RBI conduct rules (08:00 to 19:00 IST)."
  max_calls_per_day: 2  # demo default 2, lender-configurable
  honour_preferred_contact_window: true
  authorized_parties_only:
    - "borrower"
    - "co_borrower"
    - "guarantor"

negotiation:
  rule_id_ptp_max: "POLICY-PTP-MAX01"
  max_ptp_days: 7
  rule_id_part_min: "POLICY-PART-MIN01"
  min_part_payment_pct: 30.0
  max_shortfall_without_approval: 10000.0
  rule_id_waiver_prohibited: "POLICY-WAIVER-NO01"
  waiver_allowed_autonomous: false

liquidity_capture_rules:
  rule_id: "POLICY-LIQ-CAPTURE01"
  description: "Split resolution into upfront token payment and scheduled remainder."
  min_token_inr: 1000.0
  require_instant_upi_token: true
  auto_split_remainder_autopay: true
  max_mandate_installments: 3
  preferred_mandate_cadence: "WEEKLY_FRIDAY"
  mandate_wording: "mandate request sent; becomes active only when the borrower approves it in her UPI app; she can revoke it"

preventive_rules:
  rule_id: "POLICY-PREV-FEE01"
  description: "T-24h preventive intervention before scheduled debit"
  allow_pre_due_date_shift_days: 3
  bounce_charge_inr: null  # Unset by default; never imply a waiver

micro_split_rules:
  rule_id: "POLICY-MICRO-SPLIT01"
  description: "Weekly installment schedule aligned with borrower cashflow"
  allow_cashflow_micro_split: true
  max_installments: 4
  cadence: "WEEKLY_FRIDAY"
  min_first_tranche_pct: 25.0

qr_sweep_rules:
  rule_id: "POLICY-QR-SWEEP01"
  description: "Borrower-side voice-confirmed 10% daily settlement sweep"
  allow_merchant_qr_sweep: true
  default_sweep_pct: 10
  bounce_charge_inr: null

root_cause_routing:
  rule_id: "POLICY-ROOT-ROUTE01"
  description: "Downstream deterministic routing based on conversation root cause"
  categories:
    TEMPORARY_CASHFLOW_MISMATCH:
      description: "Short-term salary delay, client payment lag, or inventory cycle mismatch"
      permitted_actions: ["LIQUIDITY_CAPTURE_TOKEN_UPI", "AUTOPAY_FRIDAY_MANDATE_SPLIT", "PTP_7_DAYS"]
    MEDICAL_CALAMITY_SHOCK:
      description: "ICU, emergency hospitalization, bereavement, or natural disaster"
      mandatory_action: "FAIR-PRAC-SENS01"
      cooling_pause_days: 7
      human_follow_up_task: "check whether borrower has any insurance cover"
    DISPUTE_OR_HARDSHIP:
      description: "Prolonged job loss, business insolvency, or prior debit dispute"
      action: "ESCALATE_TO_HUMAN_CREDIT_COUNSELLING"
      promise_waiver: false
    INTENTIONAL_EVASION:
      description: "Third-party contact, persistent avoidance, or bad-faith refusal"
      action: "THIRD_PARTY_COOLING_24H_OR_LMS_RETRY"

compliance_guardrails:
  forbidden_phrases:
    - "पुलिस"
    - "police"
    - "जेल"
    - "jail"
    - "court"
    - "कोर्ट"
    - "बेशर्म"
    - "चोर"
    - "चीटर"
    - "धोखेबाज"
    - "बेइज्जत"
    - "मोहल्ले"
    - "fir"
    - "arrest"
    - "gunda"
  third_party_disclosure_prohibited: true
  mandatory_consent: true

evidence_retention:
  retention_months: 6  # call_date + 6 months
  tamper_evident_sha256: true

admin_controls:
  kill_switch:
    allow_global_pause: true
  data_export:
    formats: ["json", "csv"]
