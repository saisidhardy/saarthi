# lender-owned, board-approved policy (demo)
policy_meta:
  policy_version: "2026.3-LENDER-APPROVED"
  policy_name: "Early Delinquency & Borrower Conduct Policy"
  approved_by: "Board of Directors, Saarthi Capital Ltd. & Participating Consortium Lenders"
  effective_date: "2026-04-01"
  regulatory_catalyst: "RBI Responsible Business Conduct Amendment Directions (issued Aug 2026, mandatory Jan 1, 2027)"
  market_context:
    nach_bounce_rate_india_pct: 20.0
    msme_self_employed_bounce_rate_pct: 55.0
    bank_bounce_fee_inr: 590.0
    unit_economics:
      ai_cost_per_call_inr: 1.80
      human_telecaller_cost_inr: 52.00
      cost_reduction_pct: 96.5
      recovery_rate_lift:
        baseline_pct: 34.0
        saarthi_resolved_pct: 61.8
        net_lift_pct: 27.8
    wedge_strategy:
      step_1: "S6 Audit Mode: Zero-integration audit of existing telecaller/bot transcripts in 60s"
      step_2: "S7 T-24h Preventive Rescue: Pre-bounce liquidity capture and date shift before NACH penalty"
      step_3: "S1-S8 Full Autonomous Recovery: Multi-lingual Indic voice with UPI AutoPay cashflow splits"
  governance_statement: "Enforces board-approved lender recovery policies, zero fund custody, and strict RBI conduct rules."

opening_disclosures:
  ai_disclosure:
    mandatory: true
    rule_id: "DISC-AI-01"
    phrase_en: "I am an AI assistant calling on behalf of Saarthi Capital"
    phrase_hi: "मैं सारथी कैपिटल की ओर से बोल रहा एक एआई असिस्टेंट हूँ"
    phrase_mr: "मी सारथी कॅपिटलच्या वतीने बोलणारा एक एआय असिस्टंट आहे"
  recording_disclosure:
    mandatory: true
    rule_id: "DISC-REC-02"
    phrase_en: "This call is recorded for quality and regulatory compliance"
    phrase_hi: "यह कॉल गुणवत्ता और अनुपालन निगरानी के लिए रिकॉर्ड की जा रही है"
    phrase_mr: "हा कॉल गुणवत्ता आणि नियामक सुरक्षेसाठी रेकॉर्ड केला जातोय"
  human_opt_out:
    mandatory: true
    rule_id: "DISC-HUMAN-03"
    phrase_en: "You can say 'human' anytime to speak with a person"
    phrase_hi: "किसी भी समय किसी व्यक्ति से बात करने के लिए 'इंसान' या 'अधिकारी' बोलें"
    phrase_mr: "व्यक्तीशी बोलण्यासाठी कधीही 'इंसान' किंवा 'अधिकारी' बोला"
  human_escalation_keywords:
    - "human"
    - "agent"
    - "person"
    - "representative"
    - "इंसान"
    - "अधिकारी"
    - "एजेंट"
    - "व्यक्ति"
    - "माणूस"
    - "अधिकारी"
    - "प्रतिनिधी"
    - "adhikari"
    - "manus"

identity_verification:
  mandatory: true
  rule_id: "RBI-PRIVACY-ID01"
  field: "loan_id"
  digits_to_verify: 4
  max_attempts: 2
  on_failure: "terminate_zero_disclosure"
  third_party_contact:
    prohibit_disclosure: true
    polite_termination: true
    retry_after_hours: 24  # lender-configurable: no retry for 24h
    log_event: "third_party_contact"

sensitive_event_pause:
  rule_id: "FAIR-PRAC-SENS01"
  policy_instruction: "Immediate stop upon bereavement, hospitalization, medical emergency, natural calamity, or wedding. Express concern, no negotiation, no payment link, set do_not_contact_until 7 days."
  do_not_contact_days: 7  # demo default 7 days, lender-configurable
  allow_negotiation: false
  allow_payment_link: false
  target_desk: "Sensitive Care & Compassionate Follow-up Desk"
  triggers:
    bereavement:
      - "death"
      - "passed away"
      - "funeral"
      - "demise"
      - "मृत्यू"
      - "निधन"
      - "वारले"
      - "मयत"
      - "क्रियाकर्म"
    medical_emergency:
      - "hospital"
      - "हॉस्पिटल"
      - "hospitalised"
      - "hospitalized"
      - "icu"
      - "accident"
      - "अपघात"
      - "दवाखाना"
      - "ऍडमिट"
      - "एडमिट"
      - "बीमार"
      - "गंभीर"
      - "operation"
      - "इलाज"
    calamity:
      - "flood"
      - "earthquake"
      - "cyclone"
      - "पूर"
      - "भूकंप"
      - "आपत्ती"
      - "आपदा"
      - "आग"
    marriage_function:
      - "wedding"
      - "marriage"
      - "लग्न"
      - "शादी"
      - "विवाह"

distress_path:
  rule_id: "FAIR-PRAC-DISTRESS01"
  triggers:
    - "job loss"
    - "lost my job"
    - "नोकरी गेली"
    - "काम छूट गया"
    - "salary delay"
    - "पगार झाला नाही"
    - "salary nahi aayi"
    - "business loss"
    - "धंद्यात तोटा"
  promise_waiver: false  # Promise NO waiver
  permitted_options:
    - "Short grace-period extension (strictly within policy limit of 7 days)"
    - "Affordable upfront part-payment (>= 30%) with remainder committed within 7 days"
    - "Direct handover to certified human credit counsellor for restructuring review"
  pre_escalation_record_required: true
  target_desk: "Credit Restructuring & Financial Counselling Desk"

contact_rules:
  calling_hours_ist:
    start_ist: "08:00"
    end_ist: "19:00"
    demo_override: true
    description: "Supports RBI recovery window: Outbound contacts permitted between 08:00 and 19:00 IST."
  max_calls_per_day: 2  # demo default 2, lender-configurable; do not present as regulatory number
  honour_preferred_contact_window: true
  authorized_parties_only:
    - "borrower"
    - "co_borrower"
    - "guarantor"

negotiation:
  rule_id_ptp_max: "POLICY-PTP-MAX01"
  max_ptp_days: 7
  rule_id_part_min: "POLICY-PART-MIN01"
  min_part_payment_pct: 30.0
  max_shortfall_without_approval: 10000.0
  rule_id_waiver_prohibited: "POLICY-WAIVER-NO01"
  waiver_allowed_autonomous: false

liquidity_capture_rules:
  rule_id: "POLICY-LIQ-CAPTURE01"
  description: "Capture liquidity now: Never leave call with pure future promise. Split into immediate token UPI + locked recurring AutoPay mandate"
  min_token_inr: 1000.0
  require_instant_upi_token: true
  auto_split_remainder_autopay: true
  max_mandate_installments: 3
  preferred_mandate_cadence: "WEEKLY_FRIDAY"

preventive_rules:
  rule_id: "POLICY-PREV-FEE01"
  description: "T-24h preventive bounce intervention before eNACH/AutoPay debit"
  bank_bounce_fee_inr: 590.0
  allow_pre_due_date_shift_days: 3
  cibil_impact_prevented: true
  min_liquidity_buffer_inr: 6000.0

micro_split_rules:
  rule_id: "POLICY-MICRO-SPLIT01"
  description: "Kirana cashflow-synced weekly Friday micro-split installment schedule"
  allow_cashflow_micro_split: true
  max_installments: 4
  cadence: "WEEKLY_FRIDAY"
  min_first_tranche_pct: 25.0

insurance_rider_rules:
  rule_id: "POLICY-HOSPICASH01"
  description: "Automatic Hospicash / Credit-Shield claim packet preparation on medical calamity shock"
  max_claim_relief_inr: 15000.0
  cooling_pause_days: 7
  designated_insurer: "HDFC ERGO Health Insurance / ICICI Lombard"


root_cause_routing:
  rule_id: "POLICY-ROOT-ROUTE01"
  description: "Downstream deterministic routing based on conversation root cause"
  categories:
    TEMPORARY_CASHFLOW_MISMATCH:
      description: "Short-term salary delay, client payment lag, or festival inventory mismatch"
      permitted_actions: ["LIQUIDITY_CAPTURE_TOKEN_UPI", "AUTOPAY_FRIDAY_MANDATE_SPLIT", "PTP_7_DAYS"]
      on_settled_full_or_mandate: "UNLOCK_CIBIL_PROTECTION_AND_50K_TOPUP"
      cibil_protection_active: true
      working_capital_topup_amount_inr: 50000.0
    MEDICAL_CALAMITY_SHOCK:
      description: "ICU, emergency hospitalization, bereavement, or natural disaster"
      mandatory_action: "FAIR-PRAC-SENS01"
      cooling_pause_days: 7
      auto_draft_insurance_claim: true
      rider_name: "Attached Hospicash / Credit-Shield Micro-Insurance Claim"
      insurer_payment_target: "lender_escrow"
    DISPUTE_OR_HARDSHIP:
      description: "Prolonged job loss, business insolvency, or prior debit dispute"
      action: "ESCALATE_TO_HUMAN_CREDIT_COUNSELLING"
      promise_waiver: false
    INTENTIONAL_EVASION:
      description: "Third-party contact, persistent avoidance, or bad-faith refusal"
      action: "THIRD_PARTY_COOLING_24H_OR_LMS_RETRY"

compliance_guardrails:
  forbidden_phrases:
    - "पुलिस"
    - "police"
    - "जेल"
    - "jail"
    - "court"
    - "कोर्ट"
    - "बेशर्म"
    - "चोर"
    - "चीटर"
    - "धोखेबाज"
    - "बेइज्जत"
    - "मोहल्ले"
    - "fir"
    - "arrest"
    - "gunda"
  third_party_disclosure_prohibited: true
  mandatory_consent: true

evidence_retention:
  retention_months: 6  # call_date + 6 months
  tamper_evident_sha256: true

admin_controls:
  kill_switch:
    allow_global_pause: true
  data_export:
    formats: ["json", "csv"]
